# ─────────────────────────────────────────────────────────────
#  SonarQube Project Configuration
#  Notes Management Application
# ─────────────────────────────────────────────────────────────

sonar.projectKey=notes-app
sonar.projectName=Notes Management Application
sonar.projectVersion=1.0.2

# Source directories (Frontend + Backend)
sonar.sources=client/src,server/src

# Test directories
sonar.tests=client/__tests__,server/tests

# Test file inclusions
sonar.test.inclusions=client/__tests__/**/*.test.js,client/__tests__/**/*.test.jsx,server/tests/**/*.test.js

# Coverage reports (LCOV from Jest and nyc)
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info

# Exclusions from source analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.nyc_output/**,\
  **/*.config.js,\
  **/jest.setup.js,\
  **/__mocks__/**

# Coverage exclusions
sonar.coverage.exclusions=\
  client/__tests__/**,\
  server/tests/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  client/src/main.jsx

# Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server URL
sonar.host.url=http://localhost:9000

# Ignore React prop-types missing rule (modern React 18 functional components)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S6774
sonar.issue.ignore.multicriteria.e1.resourceKey=client/src/**/*

# Node.js Bridge Timeout & Memory settings
sonar.javascript.node.maxspace=4096
sonar.javascript.bridge.timeout=600

